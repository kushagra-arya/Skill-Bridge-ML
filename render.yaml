services:
  - type: web
    name: skill-bridge-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn skill_bridge.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        sync: false
